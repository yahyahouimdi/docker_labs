events {}
http {
    upstream frontend {
        server frontend:80;
    }
    upstream date_en {
        server date_en:5000;
    }
    upstream date_fr {
        server date_fr:5000;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Interface Web (HTML + JS)
        location / {
            proxy_pass http://frontend;
        }

        # /api/en/date -> date_en:5000/date
        location /api/en/ {
            proxy_pass http://date_en/;
        }

        # /api/fr/date -> date_fr:5000/date
        location /api/fr/ {
            proxy_pass http://date_fr/;
        }
    }
}
